<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA — Gemini Gesture AI</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050b;color:#eaf7ff;font-family:Arial,sans-serif}
#scene,canvas{position:fixed;inset:0}.hud{position:fixed;z-index:5;pointer-events:none}
.top{top:22px;left:28px;right:28px;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:700;font-size:21px;letter-spacing:5px}.logo small{display:block;font-size:7px;color:#6e819c;letter-spacing:2px}.online{font-size:9px;letter-spacing:2px;color:#75ffbc}
.side{top:130px;width:180px;font-size:8px;color:#71809a;letter-spacing:1.5px}.left{left:28px}.right{right:28px}.box{padding:12px;border-left:1px solid #65eaff55;background:#65eaff08;margin:8px 0}.box b{display:block;color:#d9e8fa;margin-top:5px;font-size:10px}
.coreText{top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}.coreText h1{margin:0;font-size:42px;letter-spacing:10px;text-shadow:0 0 35px #65eaff}.coreText p{margin:10px 0;color:#65eaff;font-size:9px;letter-spacing:4px}
.command{position:fixed;z-index:8;bottom:28px;left:50%;transform:translateX(-50%);width:min(650px,92vw)}.bar{display:flex;background:#07101ed9;border:1px solid #65eaff44;border-radius:15px;padding:5px;backdrop-filter:blur(18px)}input{flex:1;background:transparent;border:0;outline:0;color:white;padding:0 14px}button{cursor:pointer;border:0}.send{width:46px;border-radius:11px;background:#72eaff;color:#021018;font-size:20px}.quick{margin:7px 4px 0;padding:6px 9px;border-radius:8px;background:#ffffff08;border:1px solid #ffffff12;color:#75839b;font-size:7px;letter-spacing:1px}
video{position:fixed;z-index:4;right:18px;bottom:18px;width:190px;border-radius:12px;opacity:.17;transform:scaleX(-1)}#hands{position:fixed;z-index:6;inset:0;pointer-events:none}
.start{position:fixed;z-index:20;inset:0;display:grid;place-items:center;background:#02050bf5}.start button{padding:17px 28px;border-radius:12px;background:#071523;color:#dffaff;border:1px solid #65eaff66;letter-spacing:2px}
.answer{position:fixed;z-index:7;left:50%;top:67%;transform:translateX(-50%);width:min(520px,90vw);padding:14px;border:1px solid #65eaff33;background:#06101ddd;border-radius:12px;opacity:0;transition:.3s}.answer.show{opacity:1}.answer b{font-size:8px;color:#65eaff;letter-spacing:2px}.answer div{font-size:11px;line-height:1.55;margin-top:7px;color:#c1cde0}
</style></head><body>
<div id="scene"></div><canvas id="hands"></canvas><video id="cam" autoplay muted playsinline></video>
<div class="hud top"><div class="logo">NOVA<small>GESTURE INTELLIGENCE CORE</small></div><div class="online">● VISION READY</div></div>
<div class="hud side left"><div class="box">VISION<b id="vision">STANDBY</b></div><div class="box">GESTURE<b id="gesture">NONE</b></div><div class="box">CONFIDENCE<b id="confidence">--%</b></div></div>
<div class="hud side right"><div class="box">CORE LOAD<b>24%</b></div><div class="box">AI ROUTER<b>GEMINI FLASH</b></div></div>
<div class="hud coreText"><h1>NOVA</h1><p id="state">READY</p></div>
<div class="answer" id="answer"><b>NOVA RESPONSE</b><div id="answerText"></div></div>
<div class="command"><div class="bar"><input id="input" placeholder="Ask NOVA anything..."><button class="send" id="send">↗</button></div><div style="text-align:center"><button class="quick" data-q="System status">SYSTEM STATUS</button><button class="quick" data-q="Explain artificial intelligence">AI EXPLAIN</button><button class="quick" data-q="Analyze my current gesture">ANALYZE GESTURE</button></div></div>
<div class="start" id="start"><button id="activate">ACTIVATE VISION SYSTEM</button></div>
<script>
/* For production, keep the Gemini key on a server. */
const GEMINI_API_KEY="YOUR_GEMINI_API_KEY";
const GEMINI_MODEL="gemini-3.8-flash";
const scene=new THREE.Scene(),cam3=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,100);
cam3.position.z=7;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);scene.background=new THREE.Color(0x02050b);document.getElementById("scene").appendChild(renderer.domElement);
const core=new THREE.Group();scene.add(core);
const shell=new THREE.Mesh(new THREE.IcosahedronGeometry(1.25,5),new THREE.MeshBasicMaterial({color:0x65eaff,wireframe:true,transparent:true,opacity:.3}));core.add(shell);
core.add(new THREE.Mesh(new THREE.SphereGeometry(.62,48,48),new THREE.MeshBasicMaterial({color:0x9af3ff,transparent:true,opacity:.35})));
for(let i=0;i<7;i++){let r=new THREE.Mesh(new THREE.TorusGeometry(1.45+i*.17,.008,8,160),new THREE.MeshBasicMaterial({color:i%2?0x718cff:0x65eaff,transparent:true,opacity:.3}));r.rotation.x=Math.random()*3.14;r.rotation.y=Math.random()*3.14;r.userData.s=(.0015+Math.random()*.003)*(Math.random()>.5?1:-1);core.add(r)}
const n=1500,pos=new Float32Array(n*3);for(let i=0;i<n;i++){let r=1.7+Math.random()*3.3,a=Math.random()*6.28,b=Math.random()*3.14;pos[i*3]=Math.sin(b)*Math.cos(a)*r;pos[i*3+1]=Math.cos(b)*r;pos[i*3+2]=Math.sin(b)*Math.sin(a)*r}let pg=new THREE.BufferGeometry();pg.setAttribute("position",new THREE.BufferAttribute(pos,3));scene.add(new THREE.Points(pg,new THREE.PointsMaterial({color:0x65eaff,size:.018,transparent:true,opacity:.6,blending:THREE.AdditiveBlending})));
const video=document.getElementById("cam"),hc=document.getElementById("hands"),ctx=hc.getContext("2d");let gesture="NONE",tx=0,ty=0,scale=1,prev=null,tr=[];
function resize(){hc.width=innerWidth*devicePixelRatio;hc.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);renderer.setSize(innerWidth,innerHeight);cam3.aspect=innerWidth/innerHeight;cam3.updateProjectionMatrix()}addEventListener("resize",resize);resize();
function d(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function classify(h){let w=h[0],tips=[h[8],h[12],h[16],h[20]],pips=[h[6],h[10],h[14],h[18]],e=tips.map((x,i)=>d(x,w)>d(pips[i],w)*1.15),c=e.filter(Boolean).length;if(d(h[4],h[8])<.055)return["PINCH",96];if(c>=4)return["OPEN PALM",94];if(c===1&&e[0])return["POINT",92];if(c===0)return["FIST",90];return["TRACKING",65]}
const links=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]];
function draw(h){ctx.clearRect(0,0,innerWidth,innerHeight);ctx.strokeStyle="#65eaff99";ctx.lineWidth=1.3;links.forEach(([a,b])=>{ctx.beginPath();ctx.moveTo((1-h[a].x)*innerWidth,h[a].y*innerHeight);ctx.lineTo((1-h[b].x)*innerWidth,h[b].y*innerHeight);ctx.stroke()});h.forEach((p,i)=>{let x=(1-p.x)*innerWidth,y=p.y*innerHeight;ctx.beginPath();ctx.arc(x,y,i===8?5:2,0,6.28);ctx.fillStyle=i===8?"white":"#65eaff";ctx.shadowBlur=12;ctx.shadowColor="#65eaff";ctx.fill()})}
function results(r){if(!r.multiHandLandmarks?.length){gesture="NONE";document.getElementById("gesture").textContent="NONE";document.getElementById("confidence").textContent="--%";return}let h=r.multiHandLandmarks[0],[g,c]=classify(h);gesture=g;document.getElementById("gesture").textContent=g;document.getElementById("confidence").textContent=c+"%";let p=h[8],x=(1-p.x)*innerWidth,y=p.y*innerHeight;tx=(x/innerWidth-.5)*1.8;ty=-(y/innerHeight-.5)*1.4;scale=g==="PINCH"?1.18:g==="OPEN PALM"?1.08:g==="FIST"?.88:1;document.getElementById("state").textContent=g;draw(h);if(g==="POINT"){tr.push({x,y,l:1});if(tr.length>70)tr.shift();tr.forEach(q=>{q.l*=.96;ctx.beginPath();ctx.arc(q.x,q.y,q.l*7,0,6.28);ctx.fillStyle="rgba(101,234,255,"+(q.l*.35)+")";ctx.fill()})}}
async function vision(){let s=await navigator.mediaDevices.getUserMedia({video:{width:1280,height:720},audio:false});video.srcObject=s;document.getElementById("start").remove();document.getElementById("vision").textContent="LIVE";let hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});hands.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:.65,minTrackingConfidence:.6});hands.onResults(results);new Camera(video,{onFrame:async()=>hands.send({image:video}),width:1280,height:720}).start()}
async function ask(q){if(!q.trim())return;let box=document.getElementById("answer"),txt=document.getElementById("answerText");box.classList.add("show");document.getElementById("state").textContent="THINKING";if(GEMINI_API_KEY==="YOUR_GEMINI_API_KEY"){txt.textContent="Set your Gemini API key in the configuration, or connect a secure backend proxy.";document.getElementById("state").textContent="AI OFFLINE";return}try{let res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":GEMINI_API_KEY},body:JSON.stringify({contents:[{parts:[{text:`You are NOVA, a concise futuristic AI assistant. Current hand gesture: ${gesture}. User: ${q}`}]}]})});if(!res.ok)throw Error(res.status);let j=await res.json();txt.textContent=j.candidates?.[0]?.content?.parts?.map(p=>p.text||"").join("")||"No response";document.getElementById("state").textContent="RESPONSE READY"}catch(e){txt.textContent="Gemini request failed: "+e.message;document.getElementById("state").textContent="AI ERROR"}}
document.getElementById("activate").onclick=()=>vision().catch(e=>alert("Camera permission is required."));
document.getElementById("send").onclick=()=>{let i=document.getElementById("input");ask(i.value);i.value=""};document.getElementById("input").onkeydown=e=>{if(e.key==="Enter")document.getElementById("send").click()};document.querySelectorAll(".quick").forEach(b=>b.onclick=()=>ask(b.dataset.q));
function loop(){requestAnimationFrame(loop);core.rotation.y+=.0015;core.rotation.x+=.0005;core.position.x+=(tx-core.position.x)*.04;core.position.y+=(ty-core.position.y)*.04;core.scale.setScalar(1+(scale-1)*.08+Math.sin(performance.now()/800)*.015);core.children.forEach(o=>{if(o.userData.s){o.rotation.z+=o.userData.s;o.rotation.x+=o.userData.s*.3}});renderer.render(scene,cam3)}loop();
</script></body></html>
